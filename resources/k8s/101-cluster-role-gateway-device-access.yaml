apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wasmbed-gateway-device-access
rules:
  - apiGroups: ["wasmbed.github.io"]
    resources: ["devices"]
    verbs: ["get", "patch", "list","watch"]
  - apiGroups: ["wasmbed.github.io"]
    resources: [devices/status]
    verbs: ["get","patch", "update"]

