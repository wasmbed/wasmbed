[package]
name = "wasmbed-protocol-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true



[dependencies]
embassy-net = { version = "0.7", default-features = false, features = ["dhcpv4", "dns", "tcp"] }
embedded-tls = { git = "https://github.com/fratrung/embedded-tls", branch = "dev/ed25519-verifier", default-features = false, features = ["alloc"] }

rand_core = { version = "0.6.4", default-features = false }
static_cell = { version = "2.1.0", default-features = false }
heapless = { version = "0.8",  default-features = false }


[dependencies.minicbor]
version = "1.0.0"
default-features = false
features = [ "alloc" ]


[dependencies.wasmbed-protocol]
path = "../wasmbed-protocol"



